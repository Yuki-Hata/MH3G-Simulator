# ブラウザ版 (src/Mh3gSim.Web) を作って GitHub Pages に公開する。main に push するたびに作り直す。
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        id: setup
        with:
          dotnet-version: 9.0.x

      # ランナーに入っている新しい SDK ではなく、上で入れた .NET 9 の SDK とワークロードを使う
      - name: .NET 9 の SDK を使う
        run: dotnet new globaljson --sdk-version ${{ steps.setup.outputs.dotnet-version }} --force

      - name: WebAssembly のビルドツールを入れる
        run: dotnet workload install wasm-tools

      - name: データの整合チェック
        run: dotnet run --project tools/Mh3gSim.Bench -c Release -- --check-data

      - name: ブラウザ版を作る
        run: dotnet publish src/Mh3gSim.Web -c Release -o site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
